# SEI — local Neo4j for development and the pytest suite.
#
# Edition: Community. This is deliberate and matches the spec:
#   §9.1  "Neo4j Community Edition supports a single user database."
#   §12.1 "Community Edition has no clustering and one user database."
# Community therefore cannot CREATE DATABASE, so the "throwaway database per
# test module" fixture degrades to a scoped wipe of the single database —
# which is why the tests have a server of their own (neo4j-test, below).
#
# To run Enterprise instead (real per-module databases), switch the image to
# neo4j:5.26.0-enterprise and set NEO4J_ACCEPT_LICENSE_AGREEMENT=yes — after
# reading Neo4j's licence, which that variable says you accept. Not done for you.
#
# Ports are published on 127.0.0.1 only: the password below is in the
# repository, so these servers must not be reachable from the network.

services:
  neo4j:
    # Pinned to an exact minor+patch. §11.2's header warns that COUNT {},
    # NOT EXISTS { MATCH }, CALL { WITH x } and vector DDL have all shifted
    # across 5.x minors, so "5" or "5.26" would make the probes meaningless.
    image: neo4j:5.26.0-community
    container_name: sei-neo4j
    ports:
      - "127.0.0.1:7474:7474"   # HTTP / Browser
      - "127.0.0.1:7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: "neo4j/sei-dev-password"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache__size: "512m"
      # The suite creates and drops indexes repeatedly; keep startup quiet.
      NEO4J_server_config_strict__validation_enabled: "false"
    healthcheck:
      # Bolt, not HTTP: the driver is what the tests actually need up.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p sei-dev-password 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 20s
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

  # The test suite's own server. It wipes the database it uses, so it never
  # shares one with the app: SEI_TEST_NEO4J_URI defaults to bolt://localhost:7688.
  # No volume — its data is disposable by design.
  neo4j-test:
    image: neo4j:5.26.0-community
    container_name: sei-neo4j-test
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    environment:
      NEO4J_AUTH: "neo4j/sei-dev-password"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache__size: "256m"
      NEO4J_server_config_strict__validation_enabled: "false"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p sei-dev-password 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 20s

volumes:
  neo4j-data:
  neo4j-logs:
