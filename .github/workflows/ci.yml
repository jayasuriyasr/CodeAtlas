name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # The suite's own server: it wipes the database it uses (tests/db_guard.py).
      neo4j:
        image: neo4j:5.26.0-community
        env:
          NEO4J_AUTH: neo4j/sei-dev-password
          NEO4J_server_config_strict__validation_enabled: "false"
        ports:
          - 7688:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p sei-dev-password 'RETURN 1'"
          --health-interval 5s --health-timeout 10s --health-retries 40
    env:
      SEI_REQUIRE_NEO4J: "1"
      SEI_TEST_NEO4J_URI: bolt://localhost:7688
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest tests/ -q
