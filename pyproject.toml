[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sei"
version = "0.1.0"
description = "Software Engineering Investigation Engine — repository-level GraphRAG"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# The repo root is the import root: `config`, `graph`, `adapters` are top-level
# modules, exactly as the plan's repo layout draws them.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "neo4j: requires a live Neo4j (docker compose up -d)",
  "expects_unresolvable: deliberately drives move.unresolvable above zero",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# The fixture repositories are inputs to the tests, not project code: their
# unused imports and long lines are part of what the adapters are tested on,
# and the golden set points at their line numbers.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# Pyflakes, bugbear, pycodestyle errors and simplifications. Pylint's PLR
# rules are left off on purpose: "magic value" fires on every expected number
# in a test, and "too many arguments" on builders that are clearer flat.
select = ["E", "F", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Test data — sentences, source snippets, Cypher — reads better unwrapped.
"tests/**" = ["E501"]
