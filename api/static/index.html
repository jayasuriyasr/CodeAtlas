<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEI — code investigation</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1c1a; --muted: #6b675f;
    --line: #e2dfd6; --accent: #1f5f8b; --accent-ink: #ffffff;
    --ok: #2f7d4f; --ok-bg: #e4f2e8; --warn: #a15c00; --warn-bg: #fbeed6;
    --bad: #a3322a; --bad-bg: #f8e3e0; --code-bg: #f1efe8; --chip: #ebe8df;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #1f2023; --ink: #e8e6e1; --muted: #9a968d;
      --line: #313236; --accent: #6fb1dc; --accent-ink: #10202b;
      --ok: #7fcf9c; --ok-bg: #1d3327; --warn: #e8b560; --warn-bg: #3a2e17;
      --bad: #f0958c; --bad-bg: #3d211e; --code-bg: #26272b; --chip: #2c2d31;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-rows: auto 1fr; height: 100vh;
  }
  code, pre, .mono { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; }
  button { font: inherit; cursor: pointer; }

  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
    padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
  header .repo { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; align-items: center; }
  .pill {
    font-size: 12px; padding: 2px 9px; border-radius: 999px;
    background: var(--chip); color: var(--muted); white-space: nowrap;
  }
  .pill b { color: var(--ink); font-weight: 600; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .ghost {
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    border-radius: 6px; padding: 3px 10px; font-size: 13px;
  }
  .ghost:hover { border-color: var(--accent); color: var(--accent); }
  .ghost:disabled { opacity: .5; cursor: default; }

  main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); min-height: 0; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } #context { display: none; } }

  #chat { display: grid; grid-template-rows: 1fr auto; min-height: 0; border-right: 1px solid var(--line); }
  #thread { overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 18px; }
  .empty { margin: auto; max-width: 520px; text-align: center; color: var(--muted); }
  .empty h2 { color: var(--ink); font-size: 19px; margin: 0 0 6px; }
  .examples { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .examples button {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 8px; padding: 6px 11px; font-size: 13px; text-align: left;
  }
  .examples button:hover { border-color: var(--accent); }

  .turn { display: flex; flex-direction: column; gap: 8px; }
  .question {
    align-self: flex-end; max-width: 85%; background: var(--accent); color: var(--accent-ink);
    padding: 8px 12px; border-radius: 12px 12px 2px 12px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .answer {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; cursor: default;
  }
  .answer.active { border-color: var(--accent); }
  .route { font-size: 12px; color: var(--muted); margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .frames { margin: 0 0 8px; padding: 0; list-style: none; font-size: 12px; }
  .frames li { display: flex; gap: 8px; padding: 1px 0; overflow-wrap: anywhere; }
  .frames .tier { flex: 0 0 96px; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  .text pre {
    background: var(--code-bg); padding: 9px 11px; border-radius: 6px; overflow-x: auto;
    margin: 6px 0; font-size: 13px; white-space: pre;
  }
  .text code { background: var(--code-bg); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
  .text pre code { padding: 0; background: none; }
  .sent.uncited { background: var(--warn-bg); border-radius: 3px; }
  .sent.unknown { background: var(--bad-bg); border-radius: 3px; }
  .badge {
    display: inline-block; font-size: 11px; line-height: 1.5; padding: 0 6px; margin-left: 4px;
    border-radius: 999px; vertical-align: 1px; white-space: nowrap;
  }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .cite {
    border: 1px solid var(--line); background: var(--chip); color: var(--accent);
    border-radius: 5px; padding: 0 5px; font-size: 12px; margin: 0 1px;
  }
  .cite:hover, .cite.on { border-color: var(--accent); }
  .cite.missing { color: var(--bad); border-color: var(--bad); }
  .notice { font-size: 13px; color: var(--warn); margin: 8px 0; }
  .cursor::after { content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .foot {
    margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px;
  }
  .foot b { color: var(--ink); font-weight: 600; }
  .foot .review { color: var(--bad); font-weight: 600; }

  form { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); background: var(--panel); }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; min-height: 44px; max-height: 180px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .send { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 0 18px; font-weight: 600; }
  .send:disabled { opacity: .5; cursor: default; }

  #context { overflow-y: auto; padding: 18px; }
  #context h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 4px; }
  #context .report { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .block { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
  .block.flash { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .block summary { list-style: none; cursor: pointer; padding: 8px 10px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .block summary::-webkit-details-marker { display: none; }
  .block .handle { font-weight: 700; color: var(--accent); }
  .block .name { font-weight: 600; overflow-wrap: anywhere; }
  .block .where { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .block .level { margin-left: auto; font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--chip); color: var(--muted); }
  .block pre { margin: 0; padding: 10px 12px; background: var(--code-bg); overflow-x: auto; font-size: 12.5px; line-height: 1.45; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>SEI</h1>
  <span class="repo" id="repo">connecting…</span>
  <div class="pills" id="pills"></div>
  <button class="ghost" id="sync" title="Re-read every file and re-link every edge (Sync Project)">Sync project</button>
</header>

<main>
  <section id="chat">
    <div id="thread">
      <div class="empty" id="empty">
        <h2>Ask about this codebase</h2>
        <div>Every claim in the answer is checked against the code it cites. Paste a stack trace, or ask what calls a function.</div>
        <div class="examples" id="examples"></div>
      </div>
    </div>
    <form id="form">
      <textarea id="q" rows="1" placeholder="Ask a question, or paste a stack trace…  (Enter to send, Shift+Enter for a new line)" autofocus></textarea>
      <button class="send" id="send" type="submit">Ask</button>
    </form>
  </section>
  <aside id="context">
    <h2>Context shown to the model</h2>
    <div class="report" id="ctx-report">The code blocks behind an answer appear here. Click a citation like <span class="cite">C1</span> to jump to its block.</div>
    <div id="blocks"></div>
  </aside>
</main>

<script>
"use strict";
// The server only answers requests that carry this run's token. The browser is
// opened at /?token=…; keep it for this tab, take it out of the address bar,
// and add it to every request the page makes.
const TOKEN = (() => {
  const fromLink = new URLSearchParams(location.search).get("token");
  let saved = null;
  try {
    if (fromLink) sessionStorage.setItem("sei-token", fromLink);
    saved = sessionStorage.getItem("sei-token");
  } catch (e) { /* storage blocked: the link's token still works for this load */ }
  if (fromLink) history.replaceState(null, "", location.pathname);
  return fromLink || saved || "";
})();
const nativeFetch = window.fetch.bind(window);
window.fetch = (url, options = {}) => nativeFetch(url, {
  ...options, headers: { ...(options.headers || {}), Authorization: `Bearer ${TOKEN}` },
});
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let status = null;
let busy = false;
let active = null;            // the turn whose context is shown on the right

const EXAMPLES = [
  "How does this project start up?",
  "What calls `main`?",
  "Where is the database accessed?",
];

// ---- status -----------------------------------------------------------------

async function refreshStatus() {
  try {
    status = await (await fetch("/status")).json();
  } catch (e) {
    $("repo").textContent = "server not reachable";
    $("pills").innerHTML = '<span class="pill bad">offline</span>';
    return;
  }
  $("repo").textContent = status.root ? `${status.repo} · ${status.root}` : (status.repo || "");
  const pills = [];
  pills.push(status.llm
    ? `<span class="pill ok" title="Writes the answers">answers: <b>${esc(status.llm)}</b></span>`
    : `<span class="pill warn" title="${esc(status.llm_note || "")}">no answer model — code only</span>`);
  pills.push(status.vector_search
    ? `<span class="pill ok" title="Meaning-based search is on">search: <b>${esc(status.embeddings)}</b></span>`
    : `<span class="pill warn" title="${esc(status.vector_search_note || "")}">keyword + graph search</span>`);
  if (status.graph) {
    const g = status.graph;
    pills.push(`<span class="pill" title="${g.embedded} of ${g.symbols} symbols have vectors; ${g.relationships} links">`
      + `<b>${g.files}</b> files · <b>${g.symbols}</b> symbols</span>`);
  } else if (status.neo4j_error) {
    pills.push(`<span class="pill bad" title="${esc(status.neo4j_error)}">database unavailable</span>`);
  }
  const w = status.watcher;
  if (w) {
    const cls = w.state === "watching" ? "ok" : (w.state === "error" ? "bad" : "warn");
    const label = { watching: "auto-indexing on", indexing: "indexing…", starting: "starting…",
                    error: "indexing error", stopped: "auto-index stopped" }[w.state] || w.state;
    pills.push(`<span class="pill ${cls}" title="${esc(w.error || "")}">${label}</span>`);
  }
  $("pills").innerHTML = pills.join("");
  const settling = w && (w.state === "indexing" || w.state === "starting");
  setTimeout(refreshStatus, settling ? 2000 : 15000);
}

$("sync").addEventListener("click", async () => {
  if (!status || !status.repo) return;
  const button = $("sync");
  button.disabled = true; button.textContent = "Syncing…";
  try {
    const reply = await (await fetch("/index/sync", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ repo: status.repo }),
    })).json();
    button.textContent = reply.accepted ? "Synced" : "Sync failed";
  } catch (e) { button.textContent = "Sync failed"; }
  setTimeout(() => { button.disabled = false; button.textContent = "Sync project"; }, 2500);
  status = await (await fetch("/status")).json().catch(() => status);
});

// ---- rendering --------------------------------------------------------------

// Inline rendering for one piece of answer text: fenced code, `code`, **bold**
// and [C1] citations. Text is escaped first; nothing from the model is trusted.
function renderInline(text, turn) {
  let out = "";
  const fence = /(```|~~~)[^\n]*\n([\s\S]*?)(?:\1|$)/g;
  let last = 0, m;
  while ((m = fence.exec(text)) !== null) {
    out += renderProse(text.slice(last, m.index), turn);
    out += `<pre><code>${esc(m[2].replace(/\n$/, ""))}</code></pre>`;
    last = fence.lastIndex;
    if (m[0].length === 0) break;
  }
  return out + renderProse(text.slice(last), turn);
}

function renderProse(text, turn) {
  return esc(text)
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[C(\d+)\]/g, (_, n) => {
      const block = turn.blockByHandle.get("C" + n);
      const tip = block ? `${block.qualified_name} — ${block.rel_path}` : "This block was not in the context";
      return `<button type="button" class="cite${block ? "" : " missing"}" data-handle="C${n}"`
        + ` title="${esc(tip)}">C${n}</button>`;
    });
}

function badgeHtml(s) {
  if (!s.badge) return "";
  const cls = s.badge.startsWith("✓") ? "ok" : (s.badge.includes("unknown") ? "bad" : "warn");
  const tip = { ok: "This claim cites code that was shown to the model",
                warn: "This claim about the code cites nothing",
                bad: "This cites a block that does not exist" }[cls];
  return `<span class="badge ${cls}" title="${tip}">${esc(s.badge)}</span>`;
}

// Sentences arrive after the text they cover; each is located in the full text
// in order, wrapped, and given its badge. Whatever follows the last closed
// sentence is the part still being written.
function renderAnswer(turn) {
  let html = "", cursor = 0;
  for (const s of turn.sentences) {
    const at = turn.text.indexOf(s.text, cursor);
    if (at < 0) continue;
    html += renderInline(turn.text.slice(cursor, at), turn);
    const cls = !s.is_claim ? "" : (!s.valid ? " unknown" : (s.cited ? "" : " uncited"));
    html += `<span class="sent${cls}">${renderInline(s.text, turn)}</span>${badgeHtml(s)}`;
    cursor = at + s.text.length;
  }
  html += renderInline(turn.text.slice(cursor), turn);
  turn.textEl.innerHTML = html;
  turn.textEl.classList.toggle("cursor", !turn.done);
}

function renderRoute(turn) {
  const n = turn.notes;
  if (!n) return;
  const parts = [`<span class="pill"><b>${esc(n.route_taken || n.route || "")}</b></span>`];
  if (n.structural && !n.structural.fallback) {
    parts.push(`${esc(n.structural.rule)} of <code>${esc((n.structural.entity || []).join(", "))}</code>: `
      + `${n.structural.related_total} found, ${n.structural.related_shown} shown`
      + (n.structural.depth_limit != null ? ` within ${n.structural.depth_limit} hops` : "")
      + (n.structural.truncated ? ` — stopped at the result cap; there are more` : ""));
  } else if (n.structural && n.structural.fallback) {
    parts.push(`${esc(n.structural.fallback)} — answered by search instead`);
  }
  if (n.vector_search === "degraded") parts.push("meaning-based search unavailable for this question");
  turn.routeEl.innerHTML = parts.join(" ");
  const related = (n.structural && n.structural.related) || [];
  if (related.length) {
    turn.framesEl.innerHTML = related.map((r) =>
      `<li><span class="badge ${r.via ? "warn" : "ok"} tier">${r.via ? "through dispatch" : "from the graph"}</span>`
      + `<span class="mono" title="${r.via ? esc("calls " + r.via + ", which this method overrides") : ""}">${esc(r.qualified_name)}`
      + ` <span style="color:var(--muted)">${esc(r.rel_path)}:${r.start_line}`
      + `${r.path && r.path.length > 1 ? " · " + esc(r.path.join(" → ")) : ""}</span></span></li>`).join("");
  }
  if (n.frames && n.frames.length) {
    turn.framesEl.innerHTML = n.frames.map((f) => {
      const cls = (f.tier === "direct" || f.tier === "sourcemap") ? "ok" : (f.tier === "name" ? "warn" : "bad");
      return `<li><span class="badge ${cls} tier">${esc(f.badge)}</span><span class="mono">${esc(f.frame)}</span></li>`;
    }).join("");
  }
}

function renderContext(turn) {
  active = turn;
  document.querySelectorAll(".answer").forEach((el) => el.classList.toggle("active", el === turn.el));
  $("ctx-report").textContent = turn.contextReport || "No code was retrieved for this question.";
  $("blocks").innerHTML = turn.blocks.map((b) => {
    const lines = b.start_line ? `:${b.start_line}${b.end_line && b.end_line !== b.start_line ? "–" + b.end_line : ""}` : "";
    return `<details class="block" id="block-${b.handle}" ${b.level === "stub" ? "" : "open"}>`
      + `<summary><span class="handle">${b.handle}</span><span class="name">${esc(b.qualified_name)}</span>`
      + `<span class="where mono">${esc(b.rel_path)}${lines}</span><span class="level">${esc(b.level)}</span></summary>`
      + `<pre><code>${esc(b.text)}</code></pre></details>`;
  }).join("");
}

function showBlock(turn, handle) {
  if (active !== turn) renderContext(turn);
  const el = document.getElementById("block-" + handle);
  if (!el) return;
  el.open = true;
  el.scrollIntoView({ behavior: "smooth", block: "center" });
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 1400);
}

// ---- asking -----------------------------------------------------------------

function newTurn(question) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = "turn";
  el.innerHTML = `<div class="question"></div><div class="answer"><div class="route"></div>`
    + `<ul class="frames"></ul><div class="text cursor"></div><div class="extra"></div></div>`;
  el.querySelector(".question").textContent = question;
  $("thread").appendChild(el);
  const turn = {
    el: el.querySelector(".answer"), routeEl: el.querySelector(".route"),
    framesEl: el.querySelector(".frames"), textEl: el.querySelector(".text"),
    extraEl: el.querySelector(".extra"),
    text: "", sentences: [], blocks: [], blockByHandle: new Map(), notes: null,
    contextReport: "", done: false,
  };
  turn.el.addEventListener("click", (ev) => {
    const cite = ev.target.closest(".cite");
    if (cite) showBlock(turn, cite.dataset.handle); else renderContext(turn);
  });
  return turn;
}

function handleEvent(turn, ev) {
  switch (ev.type) {
    case "retrieval":
      turn.notes = ev; renderRoute(turn); break;
    case "context":
      if (ev.retry) { turn.text = ""; turn.sentences = []; }
      turn.blocks = ev.blocks; turn.contextReport = ev.report;
      turn.blockByHandle = new Map(ev.blocks.map((b) => [b.handle, b]));
      renderContext(turn); renderAnswer(turn); break;
    case "text":
      turn.text += ev.text; renderAnswer(turn); break;
    case "sentence": {
      const s = { text: ev.text, badge: ev.badge, is_claim: ev.is_claim, cited: ev.cited,
                  valid: !ev.badge.includes("unknown") };
      if (ev.amends && turn.sentences.length) turn.sentences[turn.sentences.length - 1] = s;
      else turn.sentences.push(s);
      renderAnswer(turn); break;
    }
    case "retry":
      turn.extraEl.innerHTML = `<div class="notice">Refining the answer — the first attempt was not grounded well enough`
        + (ev.added_blocks ? ` (${ev.added_blocks} more code block${ev.added_blocks > 1 ? "s" : ""} added).` : ".") + `</div>`;
      break;
    case "synthesis_unavailable":
      turn.extraEl.innerHTML = `<div class="notice">No written answer: the model is unavailable (${esc(ev.reason || "")}). `
        + `The most relevant code is listed on the right.</div>`;
      break;
    case "done": {
      turn.done = true; renderAnswer(turn);
      // The notice said "Refining…" while the second attempt streamed; once it
      // is over, say what happened rather than what is still happening.
      if (ev.retried) turn.extraEl.innerHTML = `<div class="notice">This is a second attempt: `
        + `the first one did not cite enough of its claims, so it was written again.</div>`;
      const bits = [];
      if (ev.needs_review && ev.coverage !== undefined)
        bits.push(`<span class="review">Check this answer — it is still poorly grounded</span>`);
      if (ev.coverage !== undefined) {
        bits.push(`cited claims <b>${Math.round(ev.coverage * 100)}%</b>`);
        bits.push(`relations verified <b>${Math.round(ev.relation_precision * 100)}%</b>`);
        if (ev.unknown_citations) bits.push(`<span class="review">${ev.unknown_citations} citation`
          + `${ev.unknown_citations > 1 ? "s point" : " points"} at code that was not shown</span>`);
        if (ev.unsupported_claims) bits.push(`<span class="review">${ev.unsupported_claims} cited claim`
          + `${ev.unsupported_claims > 1 ? "s name" : " names"} code its citation does not contain</span>`);
        if (ev.conflict_flags) bits.push(`<span class="review">${ev.conflict_flags} claim(s) contradict the graph</span>`);
        if (ev.ttft_seconds != null) bits.push(`first word <b>${ev.ttft_seconds.toFixed(1)}s</b>`);
        if (ev.total_seconds != null) bits.push(`total <b>${ev.total_seconds.toFixed(1)}s</b>`);
        if (ev.model) bits.push(esc(ev.model));
      }
      bits.push(esc(ev.context || ""));
      const foot = document.createElement("div");
      foot.className = "foot"; foot.innerHTML = bits.join("");
      turn.el.appendChild(foot);
      break;
    }
  }
}

async function ask(question) {
  if (busy || !question.trim()) return;
  busy = true; $("send").disabled = true;
  const turn = newTurn(question.trim());
  renderContext(turn);
  const thread = $("thread");
  thread.scrollTop = thread.scrollHeight;
  try {
    const response = await fetch("/ask", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: question.trim() }),
    });
    if (!response.ok || !response.body) throw new Error(`server answered ${response.status}`);
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let cut;
      while ((cut = buffer.indexOf("\n\n")) >= 0) {
        const frame = buffer.slice(0, cut); buffer = buffer.slice(cut + 2);
        if (!frame.startsWith("data: ")) continue;
        const stick = thread.scrollHeight - thread.scrollTop - thread.clientHeight < 80;
        handleEvent(turn, JSON.parse(frame.slice(6)));
        if (stick) thread.scrollTop = thread.scrollHeight;
      }
    }
  } catch (err) {
    turn.extraEl.innerHTML = `<div class="notice">The request failed: ${esc(String(err.message || err))}</div>`;
  }
  if (!turn.done) { turn.done = true; renderAnswer(turn); }
  busy = false; $("send").disabled = false; $("q").focus();
}

$("form").addEventListener("submit", (ev) => {
  ev.preventDefault();
  const box = $("q"), question = box.value;
  box.value = ""; box.style.height = "auto";
  ask(question);
});
$("q").addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); $("form").requestSubmit(); }
});
$("q").addEventListener("input", (ev) => {
  ev.target.style.height = "auto";
  ev.target.style.height = Math.min(ev.target.scrollHeight, 180) + "px";
});
$("examples").innerHTML = EXAMPLES.map((q) => `<button type="button">${esc(q)}</button>`).join("");
$("examples").addEventListener("click", (ev) => { if (ev.target.tagName === "BUTTON") ask(ev.target.textContent); });

refreshStatus();
</script>
</body>
</html>
